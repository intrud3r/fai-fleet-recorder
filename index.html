<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="FAI Fleet">
<title>FAI Fleet Recorder</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: #12181f; color: #e8edf2;
    font-family: -apple-system, system-ui, sans-serif;
    height: 100%; width: 100%;
  }
  body { padding: 16px; padding-top: max(16px, env(safe-area-inset-top)); }
  #status {
    font-size: 22px; font-weight: 600; line-height: 1.3;
    min-height: 1.6em; padding: 10px 2px; color: #7ff0ff;
  }
  #status.error { color: #ff8a80; }
  form#entryForm { display: flex; gap: 8px; margin-bottom: 10px; }
  #entryInput {
    flex: 1; min-width: 0; font-size: 20px; padding: 14px 12px; border-radius: 10px;
    border: 2px solid #2c3947; background: #1b232c; color: #e8edf2;
  }
  #entryInput:focus { outline: none; border-color: #7ff0ff; }
  button {
    font-size: 18px; font-weight: 600; padding: 14px 18px; border-radius: 10px;
    border: none; background: #7ff0ff; color: #06181f; cursor: pointer;
  }
  button:active { background: #5fd8ec; }
  button.secondary { background: #2c3947; color: #e8edf2; }
  .promptBox {
    background: #26313d; border: 2px solid #7ff0ff; border-radius: 10px;
    padding: 12px; margin-bottom: 12px;
  }
  .promptBox.hidden { display: none; }
  .promptBox p { margin: 0 0 10px; font-size: 17px; }
  .promptBox .row { display: flex; gap: 8px; flex-wrap: wrap; }
  #currentPreview {
    background: #1b232c; border: 1px solid #2c3947; border-radius: 10px;
    padding: 10px 12px; margin-bottom: 12px; font-size: 15px; color: #c7d3de;
  }
  #currentPreview b { color: #7ff0ff; }
  #summary { font-size: 14px; color: #8fa2b3; margin-bottom: 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 15px; margin-bottom: 16px; table-layout: fixed; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid #263140; overflow-wrap: break-word; }
  th { color: #8fa2b3; font-weight: 600; font-size: 13px; text-transform: uppercase; }
  #exportRow { display: flex; gap: 8px; }
  #exportRow button { flex: 1; }
  th.actionsCol, td.actionsCol { width: 60px; text-align: right; }
  .rowDelete {
    font-size: 13px; font-weight: 600; padding: 6px 10px; border-radius: 8px;
    background: #3a232a; color: #ff8a80; border: 1px solid #5a2f36;
  }
  .rowDelete:active { background: #4a2a30; }
</style>
</head>
<body>

<div id="status">FAI Fleet Recorder ready. Start with the first truck.</div>

<form id="entryForm" autocomplete="off">
  <input id="entryInput" type="text" autocapitalize="off" autocorrect="off"
         enterkeyhint="go" placeholder="Truck #, FAI, date, notes, or Next…">
  <button type="submit">Go</button>
</form>

<div id="dupPrompt" class="promptBox hidden">
  <p id="dupText"></p>
  <div class="row">
    <button id="dupReplace">Replace</button>
    <button id="dupNew" class="secondary">Create Another</button>
  </div>
</div>

<div id="newReportPrompt" class="promptBox hidden">
  <p id="newReportText"></p>
  <div class="row">
    <button id="nrExportFirst">Export First</button>
    <button id="nrClearAnyway" class="secondary">Clear Without Exporting</button>
    <button id="nrCancel" class="secondary">Cancel</button>
  </div>
</div>

<div id="currentPreview">Ready for the first truck.</div>

<div id="summary"></div>
<table>
  <thead><tr><th>Truck</th><th>FAI Date</th><th>Notes</th><th class="actionsCol"></th></tr></thead>
  <tbody id="entriesBody"></tbody>
</table>

<div id="exportRow">
  <button id="exportBtn">Export .xlsx</button>
  <button id="newReportBtn" class="secondary">New Report</button>
</div>

<script src="exceljs.min.js"></script>
<script>
"use strict";

const STORAGE_KEY = "faiFleetEntries";

const MONTHS = {
  jan: 1, january: 1, feb: 2, february: 2, mar: 3, march: 3,
  apr: 4, april: 4, may: 5, jun: 6, june: 6, jul: 7, july: 7,
  aug: 8, august: 8, sep: 9, sept: 9, september: 9,
  oct: 10, october: 10, nov: 11, november: 11, dec: 12, december: 12,
};
const MONTH_PATTERN = Object.keys(MONTHS).sort((a, b) => b.length - a.length).join("|");
const MONTH_RE = new RegExp("\\b(" + MONTH_PATTERN + ")\\.?\\s+(\\d{4}|\\d{2})\\b", "i");
const SLASH_DATE_RE = /\b(\d{1,2})\s*\/\s*(\d{2,4})\b/;

// --- State -------------------------------------------------------------
// Voice dictation on mobile arrives as short separate snippets (tap mic,
// say one thing, it lands in the field) rather than one long sentence, so
// entries are built up incrementally across multiple submissions instead
// of requiring it all in one line. "Next" is what actually commits it.
let entries = loadEntries();
let currentEntry = { truck: null, date: null, notes: "" };
let faiMode = false;   // just heard "FAI" -- next snippet is the date
let noteMode = false;  // just heard "notes" -- next snippet is the note text
let editingIndex = null;
let pendingDuplicate = null; // { entry: {truck, date, notes} }
// Export status isn't persisted across reloads, so if entries already exist
// at load time, assume they're unexported -- safer than risking silent data
// loss on a stale "already exported" assumption.
let unexportedChanges = entries.length > 0;

function loadEntries() {
  try {
    const raw = JSON.parse(localStorage.getItem(STORAGE_KEY));
    return Array.isArray(raw) ? raw : [];
  } catch (e) {
    return [];
  }
}
function saveEntries() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
}

// --- Parsing -------------------------------------------------------------
function normalizeYear(yr) {
  return yr.length === 4 ? yr.slice(2) : yr.padStart(2, "0");
}

function parseTruckEntry(rawText) {
  let s = rawText.replace(/,/g, " ");
  let dateStr = null;

  let m = s.match(SLASH_DATE_RE);
  if (m) {
    const mo = parseInt(m[1], 10);
    if (mo >= 1 && mo <= 12) {
      dateStr = String(mo).padStart(2, "0") + "/" + normalizeYear(m[2]);
      s = s.slice(0, m.index) + s.slice(m.index + m[0].length);
    }
  }
  if (!dateStr) {
    m = s.match(MONTH_RE);
    if (m) {
      const mo = MONTHS[m[1].toLowerCase()];
      dateStr = String(mo).padStart(2, "0") + "/" + normalizeYear(m[2]);
      s = s.slice(0, m.index) + s.slice(m.index + m[0].length);
    }
  }
  if (!dateStr) return null;

  s = s
    .replace(/\btruck\b/gi, "")
    .replace(/\bfai\b/gi, "")
    .replace(/\bdecal\b/gi, "")
    .replace(/\bexpires?\b/gi, "");

  const numMatch = s.match(/\d+/);
  if (!numMatch) return null;

  return { truck: numMatch[0], date: dateStr };
}

// A date said on its own (after a "FAI" cue, or as a stray correction).
function parseBareDate(rawText) {
  const s = rawText.replace(/,/g, " ");
  let m = s.match(SLASH_DATE_RE);
  if (m) {
    const mo = parseInt(m[1], 10);
    if (mo >= 1 && mo <= 12) return String(mo).padStart(2, "0") + "/" + normalizeYear(m[2]);
  }
  m = s.match(MONTH_RE);
  if (m) return String(MONTHS[m[1].toLowerCase()]).padStart(2, "0") + "/" + normalizeYear(m[2]);

  // Compact spoken digits with no separator, e.g. "1227" (Dec '27) or "927" (Sep '27) --
  // dictation doesn't insert a slash when someone just speaks the digits.
  const digits = s.replace(/\D/g, "");
  if (digits.length === 3) {
    const mo = parseInt(digits.slice(0, 1), 10);
    if (mo >= 1 && mo <= 9) return "0" + digits.slice(0, 1) + "/" + digits.slice(1);
  } else if (digits.length === 4) {
    const mo = parseInt(digits.slice(0, 2), 10);
    if (mo >= 1 && mo <= 12) return digits.slice(0, 2) + "/" + digits.slice(2);
  }
  return null;
}

// A truck number said on its own, with any filler words stripped.
function parseBareTruck(rawText) {
  const s = rawText
    .replace(/\btruck\b/gi, "")
    .replace(/\bfai\b/gi, "")
    .replace(/\bdecal\b/gi, "")
    .replace(/\bexpires?\b/gi, "")
    .trim();
  return /^\d+$/.test(s) ? s : null;
}

// "FAI" isn't a normal word, so dictation sometimes spells it out letter by
// letter ("F. A. I.", "F A I"). Collapse that down to a plain "fai" before
// token-scanning, so it's caught the same as if it were said normally.
function normalizeSpokenText(text) {
  return text.replace(/\bf\.?\s*a\.?\s*i\.?\b/gi, "fai");
}

// Continuous dictation often lands as ONE long string covering several
// logical steps at once ("657437 fai 1227 next"), not one snippet per tap.
// Scan through it in order, splitting on the cue words ("fai"/"next"/
// "notes"/"note") and feeding each piece through the same state machine a
// single discrete snippet would use -- so both styles of dictating work.
const CUE_RE = /\b(fai|next|notes?)(?:\b|(?=\d))/gi;

function processEntryText(rawText) {
  const parts = normalizeSpokenText(rawText).split(CUE_RE);
  for (let i = 0; i < parts.length; i++) {
    if (pendingDuplicate) return; // wait for an explicit reply before continuing
    const isCue = i % 2 === 1;
    if (isCue) {
      handleCue(parts[i].toLowerCase());
    } else {
      handleChunk(parts[i].trim());
    }
  }
}

function handleCue(cue) {
  if (cue === "next") {
    commitCurrentEntry();
    return;
  }
  if (cue === "fai") {
    faiMode = true;
    noteMode = false;
    renderPreview();
    return;
  }
  // "notes" or "note"
  noteMode = true;
  faiMode = false;
  renderPreview();
}

function handleChunk(chunk) {
  if (!chunk) return;

  if (noteMode) {
    currentEntry.notes = currentEntry.notes ? `${currentEntry.notes}; ${chunk}` : chunk;
    noteMode = false;
    renderPreview();
    return;
  }

  if (faiMode) {
    const dateOnly = parseBareDate(chunk);
    if (!dateOnly) {
      setStatus("Didn't catch a date. Try again.", true);
      return;
    }
    currentEntry.date = dateOnly;
    faiMode = false;
    renderPreview();
    return;
  }

  // Filler words alone ("truck" left over after "next truck") are silent noise.
  const fillerStripped = chunk
    .replace(/\btruck\b/gi, "")
    .replace(/\bdecal\b/gi, "")
    .replace(/\bexpires?\b/gi, "")
    .trim();
  if (!fillerStripped) return;

  // A full line in one breath (truck + date together) -- still supported.
  const combined = parseTruckEntry(chunk);
  if (combined) {
    currentEntry.truck = combined.truck;
    currentEntry.date = combined.date;
    renderPreview();
    return;
  }

  // A bare truck number on its own.
  const bareTruck = parseBareTruck(chunk);
  if (bareTruck) {
    currentEntry.truck = bareTruck;
    renderPreview();
    return;
  }

  // A bare date on its own (said out of order, or a correction).
  const bareDate = parseBareDate(chunk);
  if (bareDate) {
    currentEntry.date = bareDate;
    renderPreview();
    return;
  }

  setStatus("Could not parse that. Try again.", true);
}

// --- UI helpers -------------------------------------------------------------
const statusEl = document.getElementById("status");
const inputEl = document.getElementById("entryInput");
const summaryEl = document.getElementById("summary");
const bodyEl = document.getElementById("entriesBody");
const dupPromptEl = document.getElementById("dupPrompt");
const dupTextEl = document.getElementById("dupText");
const previewEl = document.getElementById("currentPreview");
const newReportPromptEl = document.getElementById("newReportPrompt");
const newReportTextEl = document.getElementById("newReportText");

function setStatus(text, isError) {
  statusEl.textContent = text;
  statusEl.classList.toggle("error", !!isError);
}

function refocus() {
  inputEl.value = "";
  inputEl.focus();
}

function render() {
  summaryEl.textContent = entries.length
    ? `${entries.length} truck${entries.length === 1 ? "" : "s"} recorded`
    : "No trucks recorded yet";
  bodyEl.innerHTML = "";
  entries.forEach((e, idx) => {
    const tr = document.createElement("tr");
    tr.innerHTML =
      `<td>${escapeHtml(e.truck)}</td><td>${escapeHtml(e.date)}</td><td>${escapeHtml(e.notes || "")}</td>` +
      `<td class="actionsCol"><button type="button" class="rowDelete" data-idx="${idx}">Delete</button></td>`;
    bodyEl.appendChild(tr);
  });
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

function renderPreview() {
  if (!currentEntry.truck && !currentEntry.date && !currentEntry.notes) {
    previewEl.textContent = "Ready for the first truck.";
    return;
  }
  const parts = [`Truck: <b>${currentEntry.truck ? escapeHtml(currentEntry.truck) : "—"}</b>`];
  parts.push(`FAI: <b>${currentEntry.date ? escapeHtml(currentEntry.date) : "—"}</b>`);
  if (currentEntry.notes) parts.push(`Notes: <b>${escapeHtml(currentEntry.notes)}</b>`);
  previewEl.innerHTML = parts.join("&nbsp;&nbsp;&nbsp;");
}

function resetCurrentEntry() {
  currentEntry = { truck: null, date: null, notes: "" };
  faiMode = false;
  noteMode = false;
  renderPreview();
}

function showDuplicatePrompt(entry) {
  pendingDuplicate = { entry };
  dupTextEl.textContent =
    `Truck ${entry.truck} already exists. Replace the previous entry or create another record?`;
  dupPromptEl.classList.remove("hidden");
}
function hideDuplicatePrompt() {
  pendingDuplicate = null;
  dupPromptEl.classList.add("hidden");
}

// "Next" -- commit whatever's been built up in currentEntry so far.
function commitCurrentEntry() {
  if (!currentEntry.truck) return; // nothing to commit yet -- silent no-op

  if (editingIndex === null) {
    const dupIdx = entries.findIndex((e) => e.truck === currentEntry.truck);
    if (dupIdx !== -1) {
      showDuplicatePrompt({ ...currentEntry });
      return;
    }
  } else {
    const dupIdx = entries.findIndex((e, i) => e.truck === currentEntry.truck && i !== editingIndex);
    if (dupIdx !== -1) {
      setStatus(`Truck ${currentEntry.truck} already exists elsewhere. Delete it first.`, true);
      editingIndex = null;
      resetCurrentEntry();
      return;
    }
  }
  finalizeEntry(currentEntry);
}

function finalizeEntry(entry) {
  const record = { truck: entry.truck, date: entry.date || "", notes: entry.notes || "" };
  if (editingIndex !== null) {
    entries[editingIndex] = record;
    editingIndex = null;
  } else {
    entries.push(record);
  }
  unexportedChanges = true;
  saveEntries();
  render();
  setStatus("Recorded");
  resetCurrentEntry();
}

// --- Command handling -------------------------------------------------------
// A whole dictation submission can be one snippet ("4123") or a full
// continuous run ("657437 fai 1227 next") -- processEntryText scans through
// it token by token either way, so both styles of dictating work.
function handleSubmit(rawText) {
  const text = rawText.trim();
  if (!text) {
    // Tapping Go with nothing new to say commits whatever's been built up
    // so far -- lets Go itself serve as the commit action instead of
    // requiring the spoken/typed word "next" (still recognized too).
    if (!pendingDuplicate && currentEntry.truck) commitCurrentEntry();
    return;
  }
  const lower = text.toLowerCase();

  // A pending duplicate-resolution response takes priority over everything else.
  if (pendingDuplicate) {
    if (lower === "replace") {
      const idx = entries.findIndex((e) => e.truck === pendingDuplicate.entry.truck);
      if (idx !== -1) entries[idx] = { ...pendingDuplicate.entry };
      hideDuplicatePrompt();
      unexportedChanges = true;
      saveEntries();
      render();
      setStatus("Recorded");
      resetCurrentEntry();
      return;
    }
    if (lower === "new" || lower === "another" || lower === "create another") {
      entries.push({ ...pendingDuplicate.entry });
      hideDuplicatePrompt();
      unexportedChanges = true;
      saveEntries();
      render();
      setStatus("Recorded");
      resetCurrentEntry();
      return;
    }
    setStatus("Replace the previous entry or create another record?", true);
    return;
  }

  if (lower === "show list") {
    document.querySelector("table").scrollIntoView({ behavior: "smooth" });
    return;
  }

  if (lower === "count trucks") {
    setStatus(`${entries.length} truck${entries.length === 1 ? "" : "s"}`);
    return;
  }

  if (lower === "delete last truck") {
    if (!entries.length) {
      setStatus("No trucks to delete.", true);
      return;
    }
    entries.pop();
    unexportedChanges = true;
    saveEntries();
    render();
    setStatus("Deleted.");
    return;
  }

  const editMatch = lower.match(/^edit truck (\d+)$/);
  if (editMatch) {
    const idx = entries.findIndex((e) => e.truck === editMatch[1]);
    if (idx === -1) {
      setStatus(`Truck ${editMatch[1]} not found.`, true);
      return;
    }
    editingIndex = idx;
    currentEntry = { truck: entries[idx].truck, date: entries[idx].date || null, notes: entries[idx].notes || "" };
    faiMode = false;
    noteMode = false;
    renderPreview();
    setStatus(`Editing truck ${editMatch[1]}. Say FAI + date, notes, or Next to save.`);
    return;
  }

  if (lower === "export") {
    exportXlsx();
    return;
  }

  processEntryText(text);
}

// --- Export -------------------------------------------------------------
async function exportXlsx() {
  if (!entries.length) {
    setStatus("No entries to export.", true);
    return;
  }
  setStatus("Building export…");

  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet("FAI Inspection");
  ws.columns = [
    { header: "Truck Number", key: "truck", width: 16 },
    { header: "FAI Decal Date", key: "date", width: 16 },
    { header: "Notes", key: "notes", width: 40 },
  ];
  ws.getRow(1).font = { bold: true };
  ws.views = [{ state: "frozen", ySplit: 1 }];
  for (const e of entries) {
    ws.addRow({ truck: e.truck, date: e.date, notes: e.notes || "" });
  }

  const buf = await wb.xlsx.writeBuffer();
  const today = new Date();
  const yyyy = today.getFullYear();
  const mm = String(today.getMonth() + 1).padStart(2, "0");
  const dd = String(today.getDate()).padStart(2, "0");
  const filename = `FAI_Inspection_${yyyy}-${mm}-${dd}.xlsx`;

  const blob = new Blob([buf], {
    type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
  });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);

  unexportedChanges = false;
  setStatus(`Exported ${filename}`);
}

// --- New Report ---------------------------------------------------------
function startNewReport() {
  entries = [];
  unexportedChanges = false;
  editingIndex = null;
  hideDuplicatePrompt();
  resetCurrentEntry();
  saveEntries();
  render();
  setStatus("New report started.");
}

// --- Wiring -------------------------------------------------------------
document.getElementById("entryForm").addEventListener("submit", (ev) => {
  ev.preventDefault();
  const text = inputEl.value;
  refocus();
  handleSubmit(text);
});
bodyEl.addEventListener("click", (ev) => {
  const btn = ev.target.closest(".rowDelete");
  if (!btn) return;
  const idx = parseInt(btn.dataset.idx, 10);
  if (Number.isNaN(idx) || !entries[idx]) return;
  const truck = entries[idx].truck;
  entries.splice(idx, 1);
  unexportedChanges = true;
  if (editingIndex !== null) {
    if (editingIndex === idx) {
      editingIndex = null;
      resetCurrentEntry();
    } else if (editingIndex > idx) {
      editingIndex -= 1;
    }
  }
  saveEntries();
  render();
  setStatus(`Deleted truck ${truck}.`);
});
document.getElementById("dupReplace").addEventListener("click", () => handleSubmit("replace"));
document.getElementById("dupNew").addEventListener("click", () => handleSubmit("new"));
document.getElementById("exportBtn").addEventListener("click", () => handleSubmit("export"));

document.getElementById("newReportBtn").addEventListener("click", () => {
  if (!entries.length) {
    setStatus("Already empty — ready for a new report.");
    return;
  }
  if (!unexportedChanges) {
    startNewReport();
    return;
  }
  newReportTextEl.textContent =
    `${entries.length} truck${entries.length === 1 ? "" : "s"} not yet exported. Export first, or clear without exporting?`;
  newReportPromptEl.classList.remove("hidden");
});
document.getElementById("nrExportFirst").addEventListener("click", async () => {
  newReportPromptEl.classList.add("hidden");
  await exportXlsx();
  startNewReport();
});
document.getElementById("nrClearAnyway").addEventListener("click", () => {
  newReportPromptEl.classList.add("hidden");
  startNewReport();
});
document.getElementById("nrCancel").addEventListener("click", () => {
  newReportPromptEl.classList.add("hidden");
});

render();
inputEl.focus();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
